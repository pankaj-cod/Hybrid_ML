# Default training / evaluation configuration.
data:
  path: data/raw/PJME_hourly.csv
  timestamp_col: Datetime
  target_col: PJME_MW
  max_interpolate_hours: 6       # longer gaps are an error, not silently filled

split:
  # Chronological split. The test period is only touched once, for the final report.
  val_start: "2015-01-01"        # train: everything before this
  test_start: "2017-01-01"       # validation: [val_start, test_start); test: [test_start, end]

forecast:
  horizon: 24                    # hours ahead produced by `pjme forecast`
  eval_origin_hour: 0            # day-ahead backtest issues one forecast per day at this hour

lightgbm:
  learning_rate: 0.03
  num_leaves: 63
  min_child_samples: 30
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_lambda: 1.0
  n_estimators: 5000             # upper bound, early stopping picks the real number
  early_stopping_rounds: 200
  random_state: 42

base_model:
  fourier_order: 3               # annual harmonics, each interacted with hour of day
  ridge_alpha: 1.0
  include_trend: true

ensemble:
  weight_hybrid: 0.5             # ensemble = 0.5 * lightgbm + 0.5 * hybrid (flat optimum 0.4-0.6 on validation)

# Model that is refit on the full history and saved for serving.
# Options: lightgbm, hybrid, ensemble, and bias-corrected lightgbm_bc, hybrid_bc, ensemble_bc.
# ensemble_bc was chosen on validation (2016 day-ahead MAE 1,109 vs 1,248 for hybrid).
production_model: ensemble_bc

output:
  artifacts_dir: artifacts
