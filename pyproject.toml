[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pjme-forecast"
version = "1.0.0"
description = "Hybrid (seasonal base + LightGBM residual) hourly load forecasting for PJM East"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
pjme = "pjme_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
filterwarnings = ["ignore::UserWarning:lightgbm"]
